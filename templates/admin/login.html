{% extends "base.html" %}{% block title %}Admin Login | Rotaract SIMS{% endblock %}
{% block content %}<section class="container section-pad"><div class="form-panel mx-auto"><span class="eyebrow dark-eyebrow">AUTHORIZED ACCESS</span><h2>Admin login</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autocomplete="username"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div><button class="btn btn-gold w-100">Sign in</button></form><p class="privacy-note">For authorized club administrators only.</p></div></section>{% endblock %}
