name: Flask Application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint with flake8 (syntax errors and undefined names)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Verify Flask App Import & Configuration
      env:
        SECRET_KEY: 'test-secret-key-for-ci-pipeline'
        MAIL_DEV_MODE: 'true'
      run: |
        python -c "import app; print('Flask application initialized successfully:', app.app.name)"
